<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>機台設定檢查表</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
 :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--sub:#94a3b8;--ok:#22c55e;--accent:#6366f1;--warn:#f59e0b;}
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.5}
 header{position:sticky;top:0;z-index:20;background:#111827;border-bottom:1px solid var(--line);padding:12px 14px}
 header h1{margin:0;font-size:18px;text-align:center}
 .back{position:absolute;left:10px;top:10px;background:#334155;border:0;color:#fff;padding:8px 12px;border-radius:8px;font-size:14px}
 .prog{margin-top:8px;height:8px;background:#0b1220;border-radius:99px;overflow:hidden}.prog>i{display:block;height:100%;width:0;background:var(--ok);transition:.3s}
 .ptxt{text-align:center;font-size:12px;color:var(--sub);margin-top:4px}
 main{padding:12px;max-width:560px;margin:0 auto;padding-bottom:100px}
 /* 選單 */
 .pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
 .pick button{padding:22px 10px;border:0;border-radius:14px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:17px;font-weight:700}
 .hint{color:var(--sub);text-align:center;margin:16px 4px;font-size:14px}
 /* 一鍵展開／收合 */
 .tbar{display:flex;justify-content:flex-end;margin:2px 0 10px}
 .tbtn{background:#334155;border:0;color:var(--txt);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:700}
 /* 卡片 */
 .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
 .chead{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer}
 .chead .nm{flex:1;font-weight:700}.chead .cnt{font-size:12px;color:var(--sub)}
 .chev{transition:.2s;color:var(--sub)}.card.open .chev{transform:rotate(90deg)}
 .dot{width:12px;height:12px;border-radius:50%;background:#475569;flex:0 0 auto}.card.done .dot{background:var(--ok)}
 .card.done .chead .nm::before{content:"✓ ";color:var(--ok)}
 .cbody{display:none;padding:0 14px 12px}.card.open .cbody{display:block}
 .row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:1px dashed #2b3a52;font-size:15px}
 .rowck{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
 .row .ick{width:24px;height:24px;flex:0 0 auto;accent-color:var(--ok)}
 .rowck .k{flex:1;color:var(--sub);word-break:break-word}
 .rowck input:checked~.k{color:var(--txt)}
 .ve{width:46%;flex:0 0 auto;text-align:right;font-weight:600;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:#0b1220;color:var(--txt);font-size:14px}
 .ve:focus{outline:none;border-color:var(--accent)}
 .row.done-v .ve{border-color:var(--ok);color:var(--ok)}
 .ve.changed{color:#f87171 !important;border-color:#f87171 !important;font-weight:700}
 .sec{margin:22px 4px 8px;font-size:15px;font-weight:700;color:var(--warn)}
 .toggle{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px}
 .sw{position:relative;width:52px;height:30px;flex:0 0 auto}.sw input{display:none}
 .sw span{position:absolute;inset:0;background:#475569;border-radius:99px;transition:.2s}
 .sw span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.2s}
 .sw input:checked+span{background:var(--ok)}.sw input:checked+span::after{transform:translateX(22px)}
 .seg{display:flex;gap:8px}.seg button{flex:1;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;font-weight:700}
 .seg button.on{border-color:var(--accent);background:rgba(99,102,241,.2)}
 label.fld{display:block;margin:10px 0 4px;font-size:14px;color:var(--sub)}
 input.t,textarea.t{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0b1220;color:var(--txt);font-size:16px}textarea.t{min-height:64px}
 .mcadd{background:#065f46;border:1px solid #10b981;color:#d1fae5;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:700;margin-left:8px}
 .mcrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:10px 0;background:#0b1220}
 .mcrow-hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;color:var(--txt);margin-bottom:2px}
 .mcdel{background:#7f1d1d;border:0;color:#fecaca;width:28px;height:28px;border-radius:8px;font-size:15px;font-weight:700}
 .mcrow .locHint{font-weight:400;font-size:13px}
 .mc2{display:flex;gap:8px}.mc2>div{flex:1}
 #sig{width:100%;height:170px;background:#fff;border-radius:12px;touch-action:none;display:block;cursor:pointer}
 .sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:var(--sub);font-size:13px}
 .sigbar button{background:none;border:0;color:var(--sub);font-size:14px}
 /* 放大簽名視窗（點簽名框跳出，好簽） */
 .sigmodal{position:fixed;left:0;right:0;top:0;height:100vh;height:100svh;z-index:50;background:rgba(15,23,42,.97);display:none;flex-direction:column;padding:12px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(110px + env(safe-area-inset-bottom))}
 .sigmodal.show{display:flex}
 .sigmodal .tt{color:var(--txt);text-align:center;font-size:15px;margin:2px 0 8px;flex-shrink:0}
 .sigmodal #sigBig{flex:1;min-height:0;width:100%;background:#fff;border-radius:12px;touch-action:none;display:block}
 .sigmodal .mbar{display:flex;gap:10px;margin-top:12px;flex-shrink:0}
 .sigmodal .mbar button{flex:1;padding:16px;border:0;border-radius:12px;font-size:17px;font-weight:700}
 .sigmodal .mbar .ok{background:var(--ok);color:#053}
 .sigmodal .mbar .cl{background:#334155;color:#fff}
 .sigmodal .mbar .cx{background:#475569;color:#fff}
 .bottom{position:fixed;left:0;right:0;bottom:0;background:#111827;border-top:1px solid var(--line);padding:12px;display:flex;gap:10px}
 .bottom button{flex:1;padding:15px;border:0;border-radius:12px;font-size:17px;font-weight:700}
 #save{background:var(--ok);color:#053}
 .hide{display:none}
 /* 匯出用：白底、專業版檢查表（標題色帶＋表頭上色＋隔列淡底＋綠色打勾） */
 .psheet{position:fixed;left:-10000px;top:0;width:780px;background:#fff;color:#1b2735;font-family:"Microsoft JhengHei",system-ui,sans-serif;padding:0 24px 26px}
 .psheet h2{text-align:center;margin:0 -24px 16px;font-size:23px;font-weight:800;letter-spacing:2px;color:#fff;background:#34506e;padding:18px 0}
 .psheet table{border-collapse:collapse;width:100%}
 .psheet .meta{margin-bottom:14px;font-size:13px;border:1.5px solid #b6c2ce}
 .psheet .meta td{border:1px solid #d5dde5;padding:8px 11px}
 .psheet .meta .lbl{background:#eef3f8;font-weight:700;white-space:nowrap;width:1%;color:#34506e}
 .psheet .grid{font-size:13px;border:1.5px solid #b6c2ce;margin-top:2px}
 .psheet .grid th,.psheet .grid td{border:1px solid #d5dde5;padding:7px 11px;vertical-align:middle}
 .psheet .grid th{background:#34506e;color:#fff;font-weight:700;letter-spacing:1px}
 .psheet .grid tr:nth-child(even) td{background:#f4f7fb}
 .psheet .grid .ck{text-align:center;width:34px;color:#159a45;font-weight:800;font-size:15px;background:#fff}
 .psheet .grid tr:nth-child(even) td.ck{background:#f4f7fb}
 .psheet .grid .gp{background:#e9eff6;font-weight:700;white-space:nowrap;color:#34506e}
 .psheet .grid tr:nth-child(even) td.gp{background:#e9eff6}
 .psheet .grid .vv{text-align:right;white-space:pre-wrap;word-break:break-word;font-weight:700;color:#123a63}
 .psheet .grid .vv.chg{color:#d0021b}
 .psheet .sig{margin-top:16px;border:1.5px solid #b6c2ce;width:50%}
 .psheet .sighd{background:#34506e;color:#fff;font-weight:700;letter-spacing:1px;padding:7px 11px;font-size:13px}
 .psheet .sigbox{padding:12px;background:#fff;min-height:105px;display:flex;align-items:center;justify-content:center}
 .psheet .sig img{max-width:100%;max-height:150px;width:auto;height:auto;background:#fff;display:block;margin:0 auto}
</style></head>
<body>
<header>
  <button class="back hide" id="back">‹ 返回</button>
  <h1 id="title">請選擇機台設定表</h1>
  <div class="prog hide" id="progWrap"><i id="bar"></i></div>
  <div class="ptxt hide" id="ptxt"></div>
</header>
<main id="main"></main>
<div class="bottom hide" id="bottom"><button id="save">📷 存成圖片到相簿</button></div>
<div class="sigmodal" id="sigModal">
  <div class="tt">請主管在下方簽名（可將手機轉橫向，更好簽）</div>
  <canvas id="sigBig"></canvas>
  <div class="mbar">
    <button class="cx" onclick="cancelSig()">取消</button>
    <button class="cl" onclick="clearBig()">🗑 清除</button>
    <button class="ok" onclick="confirmSig()">✓ 完成</button>
  </div>
</div>

const main=document.getElementById('main'), title=document.getElementById('title');
const back=document.getElementById('back'), bottom=document.getElementById('bottom');
const progWrap=document.getElementById('progWrap'), ptxt=document.getElementById('ptxt');
function show(el,on){el.classList.toggle('hide',!on)}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function escAttr(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function home(){
  title.textContent='請選擇機台設定表'; show(back,0);show(bottom,0);show(progWrap,0);show(ptxt,0);
  main.innerHTML='<div class="hint">選擇要核對的機台</div><div class="pick">'+
    Object.keys(MACHINES).map(m=>`<button onclick="openM('${encodeURIComponent(m)}')">${esc(m)}</button>`).join('')+'</div>';
}
let totalItems=0, curM='';
let machineInfo={};  // 最近一次 Location 查詢帶回的 {store, seat, ...},供匯出表格拆欄用
window.openM=function(enc){
  const m=decodeURIComponent(enc);
  history.pushState({v:'machine',m:m},'');   // 讓手機「上一頁」能回機台選單
  renderMachine(m);
};
function renderMachine(m){
  const groups=MACHINES[m]; curM=m;
  machineInfo={};
  title.textContent=m+' 設定檢查表'; show(back,1);show(bottom,1);show(progWrap,1);show(ptxt,1);
  totalItems=0;
  let html='<div class="tbar"><button class="tbtn" id="toggleAll">▲ 全部收合</button></div>';
  groups.forEach(g=>{
    totalItems+=g.items.length;
    const rows=g.items.map(it=>`<div class="row done-v"><label class="rowck"><input type="checkbox" class="ick" checked><span class="k">${esc(it[0])}</span></label><input class="ve" data-orig="${escAttr(it[1])}" value="${escAttr(it[1])}" onfocus="this.select()"></div>`).join('');
    html+=`<div class="card open"><div class="chead"><span class="dot"></span><span class="nm">${esc(g.group)}</span><span class="cnt"><b class="gc">0</b>/${g.items.length}</span><span class="chev">▶</span></div><div class="cbody">${rows}</div></div>`;
  });
  // 通用區塊
  html+=`<div class="sec">現場設定值</div><div class="seg" id="siteType"><button data-v="一般" class="on">一般</button><button data-v="VIP">VIP</button></div>`;
  html+=`<div class="sec">確認欄</div><div id="confirmCol"></div>`;
  html+=`<div class="sec">機台上線前確認</div><div id="preLaunch"></div>`;
  html+=`<div class="sec">改版機台 <button type="button" id="addMachine" class="mcadd">＋ 新增機台</button></div>
   <div id="machineList"></div>
   <div class="sec">改版資料</div>
   <label class="fld">改版人員</label><input class="t" id="f_staff">
   <label class="fld">備註</label><textarea class="t" id="f_note"></textarea>`;
  html+=`<div class="sec">主管簽名</div><canvas id="sig"></canvas><div class="sigbar"><span>👆 點簽名框可放大簽名</span><button onclick="clearSig()">🗑 清除重簽</button></div>`;
  main.innerHTML='<div id="sheet">'+html+'</div>';
  // 群組展開 + 逐項打勾
  document.querySelectorAll('.card').forEach(c=>{
    c.querySelector('.chead').addEventListener('click',()=>c.classList.toggle('open'));
    c.querySelectorAll('.ick').forEach(cb=>cb.addEventListener('change',()=>{
      cb.closest('.row').classList.toggle('done-v',cb.checked);
      const bx=c.querySelectorAll('.ick'),d=[...bx].filter(b=>b.checked).length;
      c.querySelector('.gc').textContent=d; c.classList.toggle('done',d===bx.length); prog();
    }));
    // 預設全部打勾：同步群組計數與完成狀態
    const bx=c.querySelectorAll('.ick'),d=[...bx].filter(b=>b.checked).length;
    c.querySelector('.gc').textContent=d; c.classList.toggle('done',d===bx.length);
  });
  // 一鍵展開／收合全部：依目前是否有展開的群組決定動作，並更新按鈕文字
  document.getElementById('toggleAll').addEventListener('click',()=>{
    const cards=[...document.querySelectorAll('#sheet .card')];
    const anyOpen=cards.some(c=>c.classList.contains('open'));
    cards.forEach(c=>c.classList.toggle('open',!anyOpen));
    document.getElementById('toggleAll').textContent=anyOpen?'▼ 全部展開':'▲ 全部收合';
  });
  mk('confirmCol',["機台是否有貼商檢","主板是否有貼軟貼"]); mk('preLaunch',PRE);
  document.querySelectorAll('#siteType button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#siteType button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}));
  initMachineList();
  initSig(); prog(); window.scrollTo(0,0);
};
function mk(id,arr){document.getElementById(id).innerHTML=arr.map(t=>`<div class="toggle"><span>${esc(t)}</span><label class="sw"><input type="checkbox" checked><span></span></label></div>`).join('')}
// 打完 Location 跳開 → 向維修單伺服器即時查機台總表 → 帶入 AN(資產編號)/SN(序號)
const LOOKUP_URL='https://purity-spiffy-phrase.ngrok-free.dev/machine-lookup';
// 把檢查表內「列名含 Asset → 填 AN、含 Serial → 填 SN」的列帶入(值為空時不覆蓋,保留原提示字)
function fillItemRows(assetNo,serialNo){
  document.querySelectorAll('#sheet .row').forEach(row=>{
    const kEl=row.querySelector('.k'),ve=row.querySelector('.ve');
    if(!kEl||!ve)return;
    const lab=kEl.textContent.toLowerCase();
    if(lab.includes('asset')&&assetNo){ve.value=assetNo;row.classList.add('done-v');markChanged(ve);}
    else if(lab.includes('serial')&&serialNo){ve.value=serialNo;row.classList.add('done-v');markChanged(ve);}
  });
}
// ===== 改版機台（多台，同機型共用一張表）=====
let mcSeq=0;
function initMachineList(){
  document.getElementById('addMachine').addEventListener('click',()=>addMachineRow());
  document.getElementById('machineList').innerHTML='';
  addMachineRow();                         // 預設 1 台
}
function machineCount(){return document.querySelectorAll('#machineList .mcrow').length;}
function renumberMachines(){
  const rows=[...document.querySelectorAll('#machineList .mcrow')];
  rows.forEach((row,i)=>{row.querySelector('.mcnum').textContent='機台 '+(i+1);
    row.querySelector('.mcdel').style.display=rows.length>1?'':'none';});   // 只剩一台時不顯示刪除
}
function addMachineRow(){
  const id=++mcSeq;
  const row=document.createElement('div');row.className='mcrow';row._info={};
  row.innerHTML=`<div class="mcrow-hd"><span class="mcnum">機台</span><button type="button" class="mcdel">✕</button></div>
   <label class="fld">Location（店家＋座位，如 AM0101）<span class="locHint"></span></label>
   <input class="t mc-loc" autocapitalize="characters" autocomplete="off" placeholder="例：AM0101（自動帶出 AN/SN）">
   <div class="mc2"><div><label class="fld">AN（資產編號）</label><input class="t mc-an"></div>
   <div><label class="fld">SN（序號）</label><input class="t mc-sn"></div></div>`;
  document.getElementById('machineList').appendChild(row);
  row.querySelector('.mc-loc').addEventListener('change',()=>mcLookup(row));
  row.querySelector('.mcdel').addEventListener('click',()=>{
    if(machineCount()<=1)return; row.remove(); renumberMachines();
  });
  renumberMachines();
  return row;
}
async function mcLookup(row){
  const locEl=row.querySelector('.mc-loc'),hint=row.querySelector('.locHint');
  const an=row.querySelector('.mc-an'),sn=row.querySelector('.mc-sn');
  const loc=(locEl.value||'').trim().toUpperCase(); locEl.value=loc;
  if(!loc){hint.textContent='';row._info={};return;}
  hint.style.color='#94a3b8';hint.textContent=' 查詢中…';
  try{
    const r=await fetch(LOOKUP_URL+'?loc='+encodeURIComponent(loc),{headers:{'ngrok-skip-browser-warning':'true'}});
    const m=await r.json();
    if(m&&m.found){
      let seat=loc; if(m.store&&loc.startsWith(m.store.toUpperCase()))seat=loc.slice(m.store.length);
      row._info={store:m.store||'',seat,model:m.model||'',active:!!m.active,found:true};
      if(m.assetNo)an.value=m.assetNo;
      if(m.serialNo)sn.value=m.serialNo;
      // 只有「單台」時才把 AN/SN 帶進檢查表項目列；多台則留原提示字（各台看下方機台表）
      if(machineCount()===1)fillItemRows(m.assetNo||'',m.serialNo||'');
      if(m.active){hint.style.color='#22c55e';hint.textContent=' ✓ 已帶入：'+(m.store||'')+' / '+(m.model||'');}
      else{hint.style.color='#f59e0b';hint.textContent=' ⚠ 已帶入，但此台為「停用」狀態，請確認';}
    }else{row._info={};hint.style.color='#f59e0b';hint.textContent=' 查無此 Location，請手動填寫';}
  }catch(e){row._info={};hint.style.color='#f59e0b';hint.textContent=' 查詢失敗（可手動填 AN/SN）';}
}
// 收集所有機台（匯出用）
function collectMachines(){
  return [...document.querySelectorAll('#machineList .mcrow')].map(row=>{
    const loc=(row.querySelector('.mc-loc').value||'').trim();
    const info=row._info||{};
    return {loc,an:(row.querySelector('.mc-an').value||'').trim(),sn:(row.querySelector('.mc-sn').value||'').trim(),
      store:info.store||'',seat:info.seat||loc};
  });
}
function prog(){const d=document.querySelectorAll('#sheet .ick:checked').length;document.getElementById('bar').style.width=(totalItems?d/totalItems*100:0)+'%';ptxt.textContent=`已核對 ${d} / ${totalItems} 項`}
back.addEventListener('click',()=>history.back());
// 點進設定值欄位時，自動選取整段（直接打字即覆蓋，免先刪）
document.addEventListener('focusin',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('ve')){setTimeout(()=>{try{t.select()}catch(_){}} ,0);}});
// 設定值被改成跟原值不同 → 標紅色（治本：一處判斷，畫面與匯出都用）
function markChanged(ve){if(ve&&ve.classList)ve.classList.toggle('changed',ve.value!==(ve.dataset.orig||''));}
document.addEventListener('input',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('ve'))markChanged(t);});
// 簽名：小框只當預覽，點一下跳出「放大視窗」好簽；完成後縮回小框，並存全解析度供匯出
let ctx, sigDataURL='';           // 小預覽 context；sigDataURL=實際簽名（全解析度，匯出用）
let bigCtx, bigCanvas, bigW, bigH;
let sigDrawing=0, sigPx, sigPy, bigBound=false;
// 大畫布的「畫圖」事件只綁一次（元素是靜態的）；用 touch 事件 + passive:false 明確擋掉頁面滑動（Pointer Events 在部分手機/內建瀏覽器擋不住 → 畫的時候整頁在動）
function bindBigDraw(){
 if(bigBound)return; bigBound=true;
 const c=document.getElementById('sigBig');
 const pos=(cx,cy)=>{const b=c.getBoundingClientRect();return[cx-b.left,cy-b.top]};
 const start=(cx,cy)=>{if(!bigCtx)return;sigDrawing=1;[sigPx,sigPy]=pos(cx,cy);};
 const move=(cx,cy)=>{if(!sigDrawing||!bigCtx)return;const[x,y]=pos(cx,cy);bigCtx.beginPath();bigCtx.moveTo(sigPx,sigPy);bigCtx.lineTo(x,y);bigCtx.stroke();[sigPx,sigPy]=[x,y];};
 const end=()=>{sigDrawing=0;};
 c.onmousedown=e=>start(e.clientX,e.clientY);
 c.onmousemove=e=>move(e.clientX,e.clientY);
 c.onmouseup=c.onmouseleave=end;
 c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];start(t.clientX,t.clientY);},{passive:false});
 c.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];move(t.clientX,t.clientY);},{passive:false});
 c.addEventListener('touchend',e=>{e.preventDefault();end();},{passive:false});
 c.addEventListener('touchcancel',end);
}
function initSig(){const c=document.getElementById('sig');const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;ctx=c.getContext('2d');ctx.scale(2,2);
 c.onclick=openSigModal;}
window.clearSig=function(){const c=document.getElementById('sig');ctx.clearRect(0,0,c.width,c.height);sigDataURL='';}
// 視窗高度用 CSS 的 100svh(工具列展開時的最小可見高度)固定住 → 工具列滑進滑出都不變動、按鈕不跳。
// 僅在瀏覽器不支援 svh 時，才用 visualViewport 補一次(不掛監聽，避免點按時 resize→視窗變小→按鈕位置跳掉→點空沒反應)。
function fitSigModal(){const m=document.getElementById('sigModal');
 if(window.CSS&&CSS.supports&&CSS.supports('height','100svh')){m.style.height='';m.style.top='';return;}
 const vv=window.visualViewport;m.style.height=(vv?vv.height:window.innerHeight)+'px';m.style.top=(vv?vv.offsetTop:0)+'px';}
// 螢幕旋轉/尺寸改變時：把大畫布內部解析度重設成新尺寸，並把已簽筆跡等比重繪回去（否則畫布座標系停在舊方向 → 簽名位置偏移）
function refitBigCanvas(){
 const m=document.getElementById('sigModal');
 if(!bigCanvas||!m.classList.contains('show'))return;
 const r=bigCanvas.getBoundingClientRect();
 if(Math.abs(r.width-bigW)<2&&Math.abs(r.height-bigH)<2)return;   // 尺寸沒實質變化就不動（避免無謂重繪）
 const prev=bigCanvas.toDataURL('image/png');                     // 先保存目前筆跡
 bigW=r.width;bigH=r.height;
 bigCanvas.width=r.width*2;bigCanvas.height=r.height*2;
 bigCtx=bigCanvas.getContext('2d');bigCtx.setTransform(1,0,0,1,0,0);bigCtx.scale(2,2);
 bigCtx.lineWidth=3;bigCtx.lineCap='round';bigCtx.lineJoin='round';bigCtx.strokeStyle='#111';
 bigCtx.clearRect(0,0,bigW,bigH);
 const im=new Image();im.onload=()=>{const s=Math.min(bigW/(im.width/2),bigH/(im.height/2));const dw=(im.width/2)*s,dh=(im.height/2)*s;bigCtx.drawImage(im,(bigW-dw)/2,(bigH-dh)/2,dw,dh);};im.src=prev;
}
function refitBigLater(){setTimeout(refitBigCanvas,250);}   // 旋轉事件常在版面更新前觸發，延遲再量才準
// 進/出真全螢幕（能用就用，最乾淨；iOS Safari/LINE 不支援時自動略過，退回 svh+安全預留仍可正常用）
function enterFsSig(m){try{const rq=m.requestFullscreen||m.webkitRequestFullscreen||m.webkitRequestFullScreen;if(rq){const r=rq.call(m);if(r&&r.catch)r.catch(()=>{});}}catch(e){}}
function exitFsSig(){try{if(document.fullscreenElement||document.webkitFullscreenElement){const ex=document.exitFullscreen||document.webkitExitFullscreen;if(ex){const r=ex.call(document);if(r&&r.catch)r.catch(()=>{});}}}catch(e){}}
// 開啟放大視窗（display 後才量得到尺寸 → 才設定畫布）
window.openSigModal=function(){
 const m=document.getElementById('sigModal');m.classList.add('show');
 enterFsSig(m);                             // 要求真全螢幕（由點擊手勢觸發，允許）；不支援則無害略過
 document.body.style.overflow='hidden';     // 鎖住背景捲動，簽名時不會不小心滑到頁面
 fitSigModal();                             // 一次性貼齊(不掛監聽)，之後量畫布才準
 window.addEventListener('resize',refitBigCanvas);window.addEventListener('orientationchange',refitBigLater);
 history.pushState({v:'sig'},'');           // 簽名視窗納入歷史 → 手機「上一頁」只關視窗
 bigCanvas=document.getElementById('sigBig');
 const r=bigCanvas.getBoundingClientRect();bigW=r.width;bigH=r.height;
 bigCanvas.width=r.width*2;bigCanvas.height=r.height*2;
 bigCtx=bigCanvas.getContext('2d');bigCtx.setTransform(1,0,0,1,0,0);bigCtx.scale(2,2);
 bigCtx.lineWidth=3;bigCtx.lineCap='round';bigCtx.lineJoin='round';bigCtx.strokeStyle='#111';
 bigCtx.clearRect(0,0,bigW,bigH);
 // 帶入既有簽名（等比置中），可續簽
 if(sigDataURL){const im=new Image();im.onload=()=>{const s=Math.min(bigW/(im.width/2),bigH/(im.height/2));const dw=(im.width/2)*s,dh=(im.height/2)*s;bigCtx.drawImage(im,(bigW-dw)/2,(bigH-dh)/2,dw,dh);};im.src=sigDataURL;}
 bindBigDraw();                             // 綁定畫圖事件（只綁一次）
};
window.closeSigModal=function(){const m=document.getElementById('sigModal');m.classList.remove('show');m.style.height='';m.style.top='';
 document.body.style.overflow='';           // 還原背景捲動
 exitFsSig();                               // 退出全螢幕（若有進入）
 window.removeEventListener('resize',refitBigCanvas);window.removeEventListener('orientationchange',refitBigLater);};
window.cancelSig=function(){history.back();};   // 走瀏覽器返回 → popstate 只關視窗、留在原檢查表
window.clearBig=function(){if(bigCtx)bigCtx.clearRect(0,0,bigW,bigH);};
window.confirmSig=function(){
 sigDataURL=bigCanvas.toDataURL('image/png');   // 全解析度，匯出用（等比例、不變形）
 // 縮繪進小預覽框（等比置中，避免變形）
 const c=document.getElementById('sig');const rr=c.getBoundingClientRect();
 ctx.clearRect(0,0,rr.width,rr.height);
 const s=Math.min(rr.width/bigW,rr.height/bigH),dw=bigW*s,dh=bigH*s;
 ctx.drawImage(bigCanvas,(rr.width-dw)/2,(rr.height-dh)/2,dw,dh);
 history.back();   // 關視窗（popstate 處理），簽名已存於 sigDataURL/小框
};
// 依現況組出「白底黑框表格」(比照原本檢查表)
function buildPrint(){
  const gv=id=>{const el=document.getElementById(id);return el?el.value:''};
  const type=(document.querySelector('#siteType button.on')||{}).dataset ? (document.querySelector('#siteType button.on').dataset.v||'') : '';
  const d=new Date(), ds=d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();
  const machines=collectMachines();
  let h=`<h2>${esc(curM)} 設定檢查表</h2>`;
  h+=`<table class="meta">
   <tr><td class="lbl">日期</td><td>${ds}</td><td class="lbl">現場設定值</td><td>${esc(type)}</td><td class="lbl">改版人員</td><td>${esc(gv('f_staff'))}</td></tr></table>`;
  // 改版機台清單（同機型多台共用一張表）
  h+=`<table class="grid" style="margin-top:8px"><tr><th>店家</th><th>Location</th><th>AN 資產編號</th><th>SN 序號</th></tr>`;
  machines.forEach(mc=>{h+=`<tr><td class="vv">${esc(mc.store)}</td><td class="vv">${esc(mc.seat)}</td><td class="vv">${esc(mc.an)}</td><td class="vv">${esc(mc.sn)}</td></tr>`;});
  h+=`</table>`;
  h+=`<table class="grid"><tr><th class="ck">✓</th><th>群組 Group</th><th>項目 Item</th><th>設定值 Value</th></tr>`;
  [...document.querySelectorAll('#sheet .card')].forEach(card=>{
    const gname=card.querySelector('.nm').textContent.replace(/^✓\s*/,'');
    const rows=[...card.querySelectorAll('.row')];
    rows.forEach((r,ri)=>{
      const item=r.querySelector('.k').textContent;
      const ve=r.querySelector('.ve');
      const val=ve.value;
      const vClass=(val!==(ve.dataset.orig||''))?'vv chg':'vv';
      const ck=r.querySelector('.ick').checked?'✔':'';
      h+='<tr><td class="ck">'+ck+'</td>'+(ri===0?`<td class="gp" rowspan="${rows.length}">${esc(gname)}</td>`:'')+`<td>${esc(item)}</td><td class="${vClass}">${esc(val)}</td></tr>`;
    });
  });
  h+=`</table>`;
  const block=(id,tt)=>{const its=[...document.querySelectorAll('#'+id+' .toggle')];if(!its.length)return'';
    let s=`<table class="grid" style="margin-top:10px"><tr><th class="ck">✓</th><th colspan="3">${tt}</th></tr>`;
    its.forEach(t=>{s+=`<tr><td class="ck">${t.querySelector('input').checked?'✔':''}</td><td colspan="3">${esc(t.querySelector('span').textContent)}</td></tr>`});
    return s+'</table>';};
  h+=block('confirmCol','確認欄')+block('preLaunch','機台上線前確認');
  const note=gv('f_note');
  if(note) h+=`<table class="grid" style="margin-top:10px"><tr><th>備註</th></tr><tr><td class="vv" style="text-align:left">${esc(note).replace(/\n/g,'<br>')}</td></tr></table>`;
  const wrap=document.createElement('div');wrap.className='psheet';wrap.innerHTML=h;
  const sig=document.createElement('div');sig.className='sig';
  sig.innerHTML='<div class="sighd">主管簽名</div>';
  const box=document.createElement('div');box.className='sigbox';
  // 用放大視窗簽的全解析度簽名（等比例、不變形）；沒簽過則退回小預覽框內容
  const img=document.createElement('img');img.src=sigDataURL||document.getElementById('sig').toDataURL('image/png');box.appendChild(img);
  sig.appendChild(box);
  wrap.appendChild(sig);
  return wrap;
}
// 存成圖片
document.getElementById('save').addEventListener('click',async()=>{
  if(!document.getElementById('sheet'))return;
  const btn=document.getElementById('save');btn.textContent='產生圖片中…';
  const node=buildPrint(); document.body.appendChild(node);
  try{
    const canvas=await html2canvas(node,{backgroundColor:'#fff',scale:2,useCORS:true});
    const name=(curM+'_設定檢查表').replace(/\s+/g,'_');
    await new Promise(res=>canvas.toBlob(async b=>{
      const file=new File([b],name+'.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});res();return}catch(e){}}
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.png';a.click();res();
    },'image/png'));
  }catch(e){alert('產生圖片失敗:'+e)}
  node.remove();
  btn.textContent='📷 存成圖片到相簿';
});
history.replaceState({v:'menu'},'');   // 標記目前為機台選單頁（歷史基底）
home();
// 手機「上一頁」/返回鍵：依歷史層級決定回到哪裡（治本，取代原本無歷史的單頁行為）
window.addEventListener('popstate',function(e){
  const st=e.state||{v:'menu'};
  const modal=document.getElementById('sigModal');
  const wasModal=modal.classList.contains('show');
  if(wasModal) closeSigModal();                   // 簽名視窗開著時，任何「上一頁」只關視窗
  if(wasModal && st.v==='machine') return;         // 關掉視窗後留在原檢查表，不重繪（保留已填內容）
  if(st.v==='machine' && st.m){ renderMachine(st.m); return; }
  home();                                          // 回機台選單
});
</script>
